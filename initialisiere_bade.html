<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Initialisiere Badge</title>
		<style>
			body {
				margin: 0;
				padding: 50px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
			}

			.badge {
				background: rgba(255, 255, 255, 0.1);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 25px;
				padding: 12px 20px;
				display: flex;
				align-items: center;
				gap: 10px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
				position: relative;
				overflow: hidden;
			}

			.badge::before {
				content: '';
				position: absolute;
				top: 0;
				left: -100%;
				width: 100%;
				height: 100%;
				background: linear-gradient(
					90deg,
					transparent,
					rgba(255, 255, 255, 0.2),
					transparent
				);
				animation: shimmer 2s infinite;
			}

			.spinner {
				width: 16px;
				height: 16px;
				border: 2px solid rgba(255, 255, 255, 0.3);
				border-top: 2px solid white;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			.text {
				color: white;
				font-size: 14px;
				font-weight: 500;
				position: relative;
				z-index: 1;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes shimmer {
				0% {
					left: -100%;
				}
				100% {
					left: 100%;
				}
			}

			@keyframes pulse {
				0%,
				100% {
					transform: scale(1);
				}
				50% {
					transform: scale(1.05);
				}
			}
		</style>
	</head>
	<body>
		<div class="badge">
			<div class="spinner"></div>
			<span class="text">Initialisiere</span>
		</div>
	</body>
</html>
