<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Apps Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f8;
        }
        
        .timer-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .timer-display {
            font-size: 72px;
            margin: 20px 0;
            font-weight: bold;
            color: #2D8CFF; /* Zoom blue */
        }
        
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        button {
            background-color: #2D8CFF;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2176E0;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .setting {
            margin: 20px 0;
        }

        .status-message {
            margin-top: 20px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <h1>Zoom Meeting Timer</h1>
        
        <div class="timer-display" id="timer">00:00:00</div>
        
        <div class="setting">
            <label for="timerDuration">Set Duration (minutes): </label>
            <input type="number" id="timerDuration" min="1" max="180" value="10">
        </div>

        <div class="timer-controls">
            <button id="startBtn">Start Timer</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Reset</button>
            <button id="foregroundBtn">Show In Meeting</button>
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        // Initialize Zoom Apps SDK
        const zoomSdk = window.zoomSdk;
        let isInForeground = false;
        let timerInterval;
        let totalSeconds = 0;
        let timerRunning = false;
        let originalDuration = 0;

        // DOM elements
        const timerDisplay = document.getElementById('timer');
        const timerDurationInput = document.getElementById('timerDuration');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const foregroundBtn = document.getElementById('foregroundBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Format time as HH:MM:SS
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            return [
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                secs.toString().padStart(2, '0')
            ].join(':');
        }

        // Update timer display
        function updateTimer() {
            if (totalSeconds > 0) {
                totalSeconds--;
                timerDisplay.textContent = formatTime(totalSeconds);
                
                // Show timer in meeting when it's active
                if (isInForeground) {
                    updateVirtualForeground();
                }
                
                // Timer completed
                if (totalSeconds === 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    
                    // Alert when timer ends
                    if (isInForeground) {
                        showTimerCompletedInMeeting();
                    } else {
                        statusMessage.textContent = "Timer completed!";
                    }
                }
            }
        }

        // Start the timer
        function startTimer() {
            if (!timerRunning) {
                // Set timer duration if it's a fresh start
                if (totalSeconds === 0) {
                    const durationMinutes = parseInt(timerDurationInput.value) || 10;
                    totalSeconds = durationMinutes * 60;
                    originalDuration = totalSeconds;
                }
                
                timerRunning = true;
                timerInterval = setInterval(updateTimer, 1000);
                
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                statusMessage.textContent = "Timer running...";
            }
        }

        // Pause the timer
        function pauseTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            statusMessage.textContent = "Timer paused";
        }

        // Reset the timer
        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            totalSeconds = 0;
            timerDisplay.textContent = "00:00:00";
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            statusMessage.textContent = "Timer reset";
            
            // Update virtual foreground if active
            if (isInForeground) {
                updateVirtualForeground();
            }
        }

        // Toggle virtual foreground for the timer display
        function toggleVirtualForeground() {
            if (!zoomSdk) {
                statusMessage.textContent = "Zoom SDK not available";
                return;
            }
            
            if (!isInForeground) {
                showTimerInMeeting();
                foregroundBtn.textContent = "Hide From Meeting";
                statusMessage.textContent = "Timer visible in meeting";
            } else {
                hideTimerFromMeeting();
                foregroundBtn.textContent = "Show In Meeting";
                statusMessage.textContent = "Timer hidden from meeting";
            }
            
            isInForeground = !isInForeground;
        }

        // Show timer in the meeting using setVirtualForeground
        function showTimerInMeeting() {
            if (!zoomSdk) return;
            
            try {
                // Create canvas for the timer display
                updateVirtualForeground();
            } catch (error) {
                statusMessage.textContent = `Error showing timer: ${error.message}`;
            }
        }

        // Update the virtual foreground with current timer state
        function updateVirtualForeground() {
            if (!zoomSdk) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 120;
            
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Set text styles
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Draw timer text
            ctx.fillText(timerDisplay.textContent, canvas.width / 2, canvas.height / 2);
            
            // Add label
            ctx.font = '20px Arial';
            ctx.fillText('Meeting Timer', canvas.width / 2, 30);
            
            // Convert canvas to blob URL
            canvas.toBlob((blob) => {
                const blobUrl = URL.createObjectURL(blob);
                
                // Set virtual foreground using SDK
                zoomSdk.callZoomApi('setVirtualForeground', {
                    imageUrl: blobUrl,
                    position: {
                        x: 10,
                        y: 10
                    }
                }).then(() => {
                    // Clean up blob URL after setting
                    URL.revokeObjectURL(blobUrl);
                }).catch((error) => {
                    statusMessage.textContent = `API Error: ${error.message}`;
                });
            });
        }

        // Show timer completed message in meeting
        function showTimerCompletedInMeeting() {
            if (!zoomSdk) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 120;
            
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.fillStyle = 'rgba(255, 50, 50, 0.8)'; // Red alert background
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Set text styles
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Draw timer text
            ctx.fillText('TIME IS UP!', canvas.width / 2, canvas.height / 2);
            
            // Convert canvas to blob URL
            canvas.toBlob((blob) => {
                const blobUrl = URL.createObjectURL(blob);
                
                // Set virtual foreground using SDK
                zoomSdk.callZoomApi('setVirtualForeground', {
                    imageUrl: blobUrl,
                    position: {
                        x: 10,
                        y: 10
                    }
                }).then(() => {
                    URL.revokeObjectURL(blobUrl);
                }).catch((error) => {
                    statusMessage.textContent = `API Error: ${error.message}`;
                });
            });
        }

        // Hide timer from meeting
        function hideTimerFromMeeting() {
            if (!zoomSdk) return;
            
            zoomSdk.callZoomApi('clearVirtualForeground')
                .catch((error) => {
                    statusMessage.textContent = `API Error: ${error.message}`;
                });
        }

        // Initialize the app when SDK is ready
        function initZoomTimer() {
            // Check if Zoom SDK is available
            if (window.zoomSdk) {
                statusMessage.textContent = "Zoom SDK connected";
                
                // Configure SDK with needed APIs
                zoomSdk.config({
                    capabilities: [
                        'setVirtualForeground',
                        'clearVirtualForeground'
                    ]
                });
            } else {
                statusMessage.textContent = "Zoom SDK not detected. Some features may not work.";
                foregroundBtn.disabled = true;
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', initZoomTimer);
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        foregroundBtn.addEventListener('click', toggleVirtualForeground);
    </script>
</body>
</html>
