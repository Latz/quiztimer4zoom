<!DOCTYPE html>
<html lang="en">
	<head>
		<script type="text/javascript" src="/scripts/sdk.js"></script>
		<script src="/src/main.js" type="module"></script>
		<link rel="stylesheet" href="/quiztimer-styles.css" />
		<title>Quiztimer 4 Zoom</title>
		<meta name="referrer" content="no-referrer" />
		<style>
			summary.smallHeading {
				text-align: left;
				cursor: pointer;
			}
			#timerSize {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 2px;
			}
			.btn_timerSize {
				background-color: #f0f0f0;
				border: 1px solid #ccc;
				border-radius: 4px;
				padding: 2px 5px;
				min-inline-size: 44px; /* width */
				min-block-size: 36px; /* height – can be tweaked */
				cursor: pointer;
				font-weight: bold;
			}
			.btn_timerSize:hover {
				background-color: #e0e0e0;
			}
			#val_timerSize_container {
				min-width: 30px;
				text-align: center;
			}
			body:not(.options-open) {
				overflow-y: hidden;
			}
		</style>
	</head>
	<body>
		<div id="container">
			<div id="actions">
				<div class="div1">
					<button id="btn_startStop" class="ripple-button">Start</button>
				</div>
				<div class="div2"><button id="btn_continue">Continue</button></div>
				<div class="div3"><button id="btn_20sec">20 Sek.</button></div>
				<div class="div4"><button id="btn_30sec">30 Sek.</button></div>
			</div>
			<div id="subActions">
				<progress id="countdown" max="100" value="100"></progress>
				<span title="Options" id="btn_options">🛠️</span>
				<span title="About" id="btn_help">❓</span>
				<span title="Reset timer" id="btn_panic">💥</span>
			</div>

			<div id="options">
				<details id="position">
					<summary class="smallHeading">Position</summary>
					<div id="corners">
						<div id="positionCorners">
							<button id="posTopLeft">🡤</button>
							<button id="posTopRight">🡥</button>
							<button id="posBottomLeft">🡧</button>
							<button id="posBottomRight">🡦</button>
						</div>
					</div>
				</details>

				<details>
					<summary class="smallHeading">Timer size</summary>

					<div id="timerSize">
						<button
							class="btn_timerSize"
							id="btn_timerSizeMinusFast"
							title="Smaller fast"
						>
							&lt;&lt;
						</button>
						<button
							class="btn_timerSize"
							id="btn_timerSizeMinus"
							title="Smaller"
						>
							&lt;
						</button>
						<span id="val_timerSize_container"> </span>
						<button class="btn_timerSize" id="btn_timerSizePlus" title="Bigger">
							&gt;
						</button>
						<button
							class="btn_timerSize"
							id="btn_timerSizePlusFast"
							title="Bigger fast"
						>
							&gt;&gt;
						</button>
					</div>
				</details>
				<details>
					<summary class="smallHeading">Color</summary>
					<div class="colorHeading">Standard</div>

					<div class="colorcontainer">
						<section class="colorcontainer">
							<!-- Standard -->
							<div>
								<input type="color" id="colorSelectorNumberStandard" />
							</div>
							<div>
								<input type="color" id="colorSelectorBackgroundStandard" />
							</div>
							<div class="number">Foreground</div>
							<div class="background">Background</div>
							<div class="example" id="colorSelectorExampleStandard">20</div>
						</section>
					</div>

					<div class="colorHeading">Warning</div>
					<div class="colorcontainer">
						<section class="colorcontainer">
							<!-- Warning -->
							<div>
								<input type="color" id="colorSelectorNumberWarning" />
							</div>
							<div>
								<input type="color" id="colorSelectorBackgroundWarning" />
							</div>
							<div class="number">Foreground</div>
							<div class="background">Background</div>
							<div class="example" id="colorSelectorExampleWarning">20</div>
						</section>
					</div>

					<div class="colorHeading">Timeout</div>
					<div class="colorcontainer">
						<section class="colorcontainer">
							<!-- Warning -->
							<div>
								<input type="color" id="colorSelectorNumberTimeout" />
							</div>
							<div>
								<input type="color" id="colorSelectorBackgroundTimeout" />
							</div>
							<div class="number">Foreground</div>
							<div class="background">Background</div>
							<div class="example" id="colorSelectorExampleTimeout">20</div>
						</section>
					</div>
				</details>
				<hr />
			</div>
		</div>
	</body>
</html>
