<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Timer App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 500px;
        }
        #timerCanvas {
            margin: 1rem 0;
            border-radius: 5px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            background-color: #2D8CFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #2681F2;
        }
        #timeInput {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        input {
            width: 3rem;
            text-align: center;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        label {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zoom Timer</h1>
        
        <div id="timeInput">
            <label>
                <input type="number" id="minutes" min="0" max="59" value="5">
                <span>Minutes</span>
            </label>
            <label>
                <input type="number" id="seconds" min="0" max="59" value="0">
                <span>Seconds</span>
            </label>
        </div>
        
        <canvas id="timerCanvas" width="400" height="200"></canvas>
        
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/zoomus-websdk/2.9.0/zoom-meeting-embedded-2.9.0.min.js"></script>
    <script>
        // Initialize variables
        let timerInterval;
        let totalSeconds = 300; // Default: 5 minutes
        let currentTime = totalSeconds;
        let isRunning = false;
        
        // DOM elements
        const canvas = document.getElementById('timerCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        
        // Mock ZoomAppsSDK for development without actual Zoom integration
        const ZoomAppsSDK = window.zoomSdk || {
            isInitialized: false,
            drawImage: function(canvasElement) {
                console.log("ZoomAppsSDK drawImage called");
                // This would normally send the canvas to Zoom
            },
            initialize: function() {
                console.log("ZoomAppsSDK initialized");
                this.isInitialized = true;
                return Promise.resolve();
            }
        };
        
        // Initialize Zoom SDK
        async function initializeZoomSDK() {
            try {
                await ZoomAppsSDK.initialize();
                console.log("Zoom Apps SDK initialized");
            } catch (error) {
                console.error("Error initializing Zoom Apps SDK:", error);
            }
        }
        
        // Update timer inputs
        function updateInputs() {
            minutesInput.value = Math.floor(currentTime / 60);
            secondsInput.value = currentTime % 60;
        }
        
        // Read timer inputs
        function readInputs() {
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            totalSeconds = mins * 60 + secs;
            currentTime = totalSeconds;
        }
        
        // Format time as MM:SS
        function formatTime(time) {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Draw timer on canvas
        function drawTimer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Progress bar
            const progressWidth = (currentTime / totalSeconds) * canvas.width;
            ctx.fillStyle = currentTime < 60 ? '#ff4d4d' : '#4caf50';
            ctx.fillRect(0, 0, progressWidth, canvas.height);
            
            // Timer text
            ctx.fillStyle = '#333';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(formatTime(currentTime), canvas.width / 2, canvas.height / 2);
            
            // Send canvas to Zoom if SDK is initialized
            if (ZoomAppsSDK.isInitialized) {
                ZoomAppsSDK.drawImage(canvas);
            }
        }
        
        // Start timer
        function startTimer() {
            if (isRunning) return;
            
            if (currentTime <= 0) {
                readInputs();
            }
            
            isRunning = true;
            
            timerInterval = setInterval(() => {
                if (currentTime > 0) {
                    currentTime--;
                    updateInputs();
                    drawTimer();
                    
                    if (currentTime === 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        
                        // Alert when timer ends
                        setTimeout(() => {
                            alert("Time's up!");
                        }, 100);
                    }
                }
            }, 1000);
        }
        
        // Pause timer
        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }
        
        // Reset timer
        function resetTimer() {
            pauseTimer();
            readInputs();
            drawTimer();
        }
        
        // Event listeners
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        minutesInput.addEventListener('change', () => {
            if (!isRunning) {
                readInputs();
                drawTimer();
            }
        });
        
        secondsInput.addEventListener('change', () => {
            if (!isRunning) {
                readInputs();
                drawTimer();
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeZoomSDK();
            readInputs();
            drawTimer();
        });
    </script>
</body>
</html>
