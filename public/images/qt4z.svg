<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#fff" stroke-width="4"/>

  <!-- Timer circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#fff" stroke-width="3" opacity="0.3"/>

  <!-- Clock face -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Hour markers -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="100" y1="35" x2="100" y2="45" />
    <!-- 3 o'clock -->
    <line x1="165" y1="100" x2="155" y2="100" />
    <!-- 6 o'clock -->
    <line x1="100" y1="165" x2="100" y2="155" />
    <!-- 9 o'clock -->
    <line x1="35" y1="100" x2="45" y2="100" />
  </g>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="#fff"/>

  <!-- Timer hands -->
  <!-- Hour hand -->
  <line x1="100" y1="100" x2="100" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="100" y1="100" x2="140" y2="100" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- Countdown indicator (bottom arc) -->
  <path d="M 65 135 A 35 35 0 0 1 135 135" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>

  <!-- Zoom integration indicator (small 'Z') -->
  <text x="155" y="155" font-size="24" font-weight="bold" fill="#fff" opacity="0.8">Z</text>
</svg>
